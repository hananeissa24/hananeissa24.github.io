<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hanan Eissa — Product Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C1B19;
    --cream:#F5F1EA;
    --wine:#783B4B;
    --muted:#8A8A83;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
  }
  h1{
    font-family:'Caveat',cursive;
    font-weight:700;
    font-size:64px;
    color:var(--ink);
    margin-bottom:8px;
  }
  p{
    font-size:14px;
    color:var(--muted);
    letter-spacing:0.08em;
    text-transform:uppercase;
  }
  .status{
    margin-top:32px;
    font-size:13px;
    color:var(--wine);
    font-weight:500;
  }
</style>
</head>
<body>
  <h1>Hanan Eissa</h1>
  <p>Product Designer — UI/UX &amp; Research</p>
  <p class="status">Portfolio coming soon</p>
</body>
</html>
